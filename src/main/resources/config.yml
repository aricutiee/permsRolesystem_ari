# TurtleRoles configuration. Authority comes from the stored role, not from permission
# nodes or OP except for the single designated OWNER.

limits:
  helper-temp-mute-seconds: 3600
  moderator-temp-mute-seconds: 604800
  moderator-temp-ban-seconds: 604800
  reason-max-length: 240

history:
  page-size: 8

mute:
  blocked-command-aliases:
    - msg
    - tell
    - w
    - whisper
    - reply
    - r
    - me

inventory-inspection:
  refresh-ticks: 10

presentation:
  overhead-tags-enabled: true

security:
  strict-op-reconciliation: true

resource-pack:
  enabled: true
  auto-send-on-join: true
  required: true
  # Host build/distributions/TurtleRoles-resource-pack.zip at a public HTTPS URL and
  # paste that URL here. Do not use localhost for remote players.
  url: ""
  # Paste the generated SHA-1 from build/distributions/TurtleRoles-resource-pack.sha1.
  sha1: ""
  uuid: "6d68e47c-1680-478f-bd80-f54ef82dfef0"
  timeout-seconds: 45
  max-retries: 1
  prompt: "TurtleRoles uses this server pack to show role badges in chat and the player list. Accept it to join."
  # Minekeep permits HTTPS access to this port at https://SERVER.minekeep.dev:2053.
  self-host:
    enabled: false
    port: 2053
